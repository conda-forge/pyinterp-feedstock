schema_version: 1

context:
  name: pyinterp
  version: 2026.7.0
  build_number: 0
  sha256: 08324c24c1f631fde60a0b7123ab2758bf87efec2b0780a3d9d0e7844cc03577

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/CNES/pangeo-${{ name }}/releases/download/${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: ${{ build_number }}
  skip:
    - (aarch64 or ppc64le) and blas == "mkl"
  string: ${{ blas }}_py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
  variant:
    down_prioritize_variant: ${{ 1 if blas == "mkl" else 0 }}
  # No `script:` key: rattler-build auto-runs build.sh (unix) / build.bat (win),
  # which patch the Boost headers before invoking pip.

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - setuptools
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: linux or osx
      then: make
    - if: win
      then: m2-patch
      else: patch
  host:
    - dask
    - libboost-headers >=1.90
    - if: blas == "mkl"
      then: mkl-devel
    - if: (blas == "openblas") and (win or linux)
      then: openblas
    - if: osx
      then: blas * accelerate
    - numpy
    - pip
    - pytest
    - python
    - setuptools
    - xarray
  run:
    - dask *
    - if: blas == "mkl"
      then: mkl *
    - if: (blas == "openblas") and (win or linux)
      then: openblas *
    - if: osx
      then: blas * accelerate
    - python
    - xarray >=0.13
  ignore_run_exports:
    from_package:
      - xarray
      - numpy
      - libboost-devel

tests:
  - requirements:
      run:
        - pytest
    script:
      interpreter: python
      content: |
        import pathlib
        import pytest
        import pyinterp
        test_dir = pathlib.Path(pyinterp.__file__).parent / 'tests'
        pytest.main(["-q", str(test_dir)])

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python library for optimized geo-referenced interpolation
  description: |
    Tools for interpolating geo-referenced data used in the field of
    geosciences. There are other libraries that cover this problem, but written
    entirely in Python, the performance of these projects was not quite
    sufficient for our needs. That is why this project was created.
  homepage: https://github.com/CNES/pangeo-pyinterp
  repository: https://github.com/CNES/pangeo-pyinterp
  documentation: https://cnes.github.io/pangeo-pyinterp/

extra:
  recipe-maintainers:
    - fbriol
